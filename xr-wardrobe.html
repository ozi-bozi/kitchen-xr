<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XR Wardrobe — three.js</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; }

  #overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #0a0a0f;
    color: #e8e4d9;
    font-family: 'Courier New', monospace;
    z-index: 100;
    gap: 2rem;
  }
  #overlay h1 { font-size: 2rem; font-weight: 400; letter-spacing: 0.15em; text-transform: uppercase; }
  #overlay p { font-size: 0.85rem; color: #888; text-align: center; max-width: 340px; line-height: 1.7; }
  #xr-btn {
    padding: 14px 36px;
    background: transparent;
    border: 1px solid #e8e4d9;
    color: #e8e4d9;
    font-family: inherit;
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  #xr-btn:hover { background: #e8e4d9; color: #0a0a0f; }
  #xr-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  #not-supported { display: none; color: #c0392b; font-size: 0.8rem; }

  #info {
    position: fixed; top: 1rem; left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-family: monospace;
    font-size: 0.8rem;
    background: rgba(0,0,0,0.5);
    padding: 8px 16px;
    border-radius: 4px;
    z-index: 200;
    pointer-events: none;
    display: none;
  }
</style>
</head>
<body>

<div id="overlay">
  <h1>XR Furniture</h1>
  <p>הנח ארון בחדר שלך.<br>כוון למשטח · לחץ Trigger למיקום<br>Thumbstick לסובב / גודל</p>
  <button id="xr-btn">Enter Mixed Reality</button>
  <span id="not-supported">WebXR לא נתמך — פתח ב-Meta Quest Browser</span>
</div>

<div id="info">כוון למשטח ולחץ Trigger</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

// ─── Renderer ────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;

// חשוב: מגדיר passthrough מלא לכל החדר
renderer.xr.setFramebufferScaleFactor(1.0);
document.body.appendChild(renderer.domElement);

// ─── Scene ───────────────────────────────────────────────
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 50);
scene.add(camera);

// ─── Lights ──────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 1.5));
const dir = new THREE.DirectionalLight(0xfff5e0, 2.5);
dir.position.set(2, 4, 2);
scene.add(dir);
const fill = new THREE.DirectionalLight(0xe0eeff, 0.8);
fill.position.set(-2, 2, -1);
scene.add(fill);

// ─── Wardrobe ────────────────────────────────────────────
function buildWardrobe() {
  const g = new THREE.Group();
  const wood = new THREE.MeshStandardMaterial({ color: 0xc8a96e, roughness: 0.7 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x3d2b1f, roughness: 0.8 });
  const handle = new THREE.MeshStandardMaterial({ color: 0xb0986a, roughness: 0.3, metalness: 0.6 });
  const edge = new THREE.MeshStandardMaterial({ color: 0x5a3e28, roughness: 0.9 });

  const W = 1.0, H = 2.0, D = 0.55, t = 0.03;

  [
    [W, t, D, 0, H/2, 0],
    [W, t, D, 0, -H/2, 0],
    [t, H, D, -W/2, 0, 0],
    [t, H, D, W/2, 0, 0],
    [W, H, t*0.5, 0, 0, -D/2],
    [W-t*2, t, D-t, 0, 0.15, 0],
    [t, H-t*2, D-t, 0, 0, 0],
  ].forEach(([w,h,d,x,y,z]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), wood);
    m.position.set(x,y,z);
    g.add(m);
  });

  const dW = (W - t*3)/2, dH = H - t*2;
  [-1,1].forEach(s => {
    const dg = new THREE.Group();
    dg.position.set(s*(dW/2+t/2), 0, D/2);
    const door = new THREE.Mesh(new THREE.BoxGeometry(dW,dH,t),
      new THREE.MeshStandardMaterial({ color: 0xd4aa75, roughness: 0.65 }));
    dg.add(door);
    const inset1 = new THREE.Mesh(new THREE.BoxGeometry(dW*0.78,dH*0.38,t*0.4), edge);
    inset1.position.set(0, dH*0.27, t*0.3); dg.add(inset1);
    const inset2 = new THREE.Mesh(new THREE.BoxGeometry(dW*0.78,dH*0.5,t*0.4), edge);
    inset2.position.set(0, -dH*0.2, t*0.3); dg.add(inset2);
    const h1 = new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,0.12,12), handle);
    h1.rotation.z = Math.PI/2;
    h1.position.set(-s*(dW*0.38), 0, t*0.7); dg.add(h1);
    g.add(dg);
  });

  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz]) => {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.06,0.06), dark);
    leg.position.set(sx*(W/2-0.06), -H/2-0.03, sz*(D/2-0.06));
    g.add(leg);
  });

  const crown = new THREE.Mesh(new THREE.BoxGeometry(W+0.04,0.04,D+0.04), edge);
  crown.position.set(0, H/2+0.02, 0);
  g.add(crown);

  return g;
}

const wardrobe = buildWardrobe();
wardrobe.visible = false;
scene.add(wardrobe);

// ─── Placement ring ──────────────────────────────────────
const ringGeo = new THREE.RingGeometry(0.45, 0.5, 48);
ringGeo.rotateX(-Math.PI / 2);
const ringMat = new THREE.MeshBasicMaterial({
  color: 0x00ffcc, transparent: true, opacity: 0.8, side: THREE.DoubleSide
});
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.visible = false;
scene.add(ring);

// ─── State ───────────────────────────────────────────────
let hitTestSource = null;
let placed = false;
let rotY = 0, scaleV = 1.0;

// ─── Controllers ─────────────────────────────────────────
const cmf = new XRControllerModelFactory();

function onSelect() {
  if (!placed && ring.visible) {
    placed = true;
    wardrobe.visible = true;
    wardrobe.position.set(ring.position.x, ring.position.y + 1.0, ring.position.z);
    wardrobe.rotation.y = rotY;
    ring.visible = false;
    document.getElementById('info').textContent = 'Thumbstick: סובב / גודל';
  }
}

[0, 1].forEach(i => {
  const c = renderer.xr.getController(i);
  c.addEventListener('selectstart', onSelect);
  scene.add(c);
  const grip = renderer.xr.getControllerGrip(i);
  grip.add(cmf.createControllerModel(grip));
  scene.add(grip);
});

// ─── Session start ───────────────────────────────────────
renderer.xr.addEventListener('sessionstart', async () => {
  const session = renderer.xr.getSession();
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('info').style.display = 'block';

  // local-floor = הסצנה מעוגנת לרצפה האמיתית, ללא "בועה"
  const floorSpace = await session.requestReferenceSpace('local-floor');
  renderer.xr.setReferenceSpace(floorSpace);

  // hit-test מכיוון המבט
  const viewerSpace = await session.requestReferenceSpace('viewer');
  hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

  session.addEventListener('end', () => {
    hitTestSource = null;
    placed = false;
    wardrobe.visible = false;
    ring.visible = false;
    document.getElementById('overlay').style.display = 'flex';
    document.getElementById('info').style.display = 'none';
  });
});

// ─── XR Button ───────────────────────────────────────────
const supported = await navigator.xr?.isSessionSupported('immersive-ar').catch(() => false);

if (supported) {
  document.getElementById('xr-btn').addEventListener('click', () => {
    navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test', 'local-floor'],
      optionalFeatures: ['hand-tracking', 'bounded-floor']
    }).then(s => renderer.xr.setSession(s))
      .catch(e => alert('שגיאה: ' + e.message));
  });
} else {
  document.getElementById('xr-btn').disabled = true;
  document.getElementById('not-supported').style.display = 'block';
}

// ─── Render loop ─────────────────────────────────────────
const clock = new THREE.Clock();

renderer.setAnimationLoop((_, frame) => {
  const t = clock.getElapsedTime();

  // פולס לטבעת
  if (!placed) ringMat.opacity = 0.5 + 0.3 * Math.sin(t * 4);

  // Hit test — מציב את הטבעת על הרצפה האמיתית
  if (frame && hitTestSource && !placed) {
    const hits = frame.getHitTestResults(hitTestSource);
    if (hits.length > 0) {
      const pose = hits[0].getPose(renderer.xr.getReferenceSpace());
      if (pose) {
        const m = new THREE.Matrix4().fromArray(pose.transform.matrix);
        ring.visible = true;
        ring.position.setFromMatrixPosition(m);
        // מיישר את הטבעת לכיוון המבט (ציר Y בלבד)
        const q = new THREE.Quaternion().setFromRotationMatrix(m);
        ring.quaternion.copy(q);
        ring.rotateX(-Math.PI / 2);
      }
    } else {
      ring.visible = false;
    }
  }

  // Thumbstick
  const session = renderer.xr.getSession();
  if (session && placed) {
    for (const src of session.inputSources) {
      if (!src.gamepad) continue;
      const ax = src.gamepad.axes;
      if (ax.length >= 4) {
        if (Math.abs(ax[2]) > 0.12) { rotY -= ax[2] * 0.03; wardrobe.rotation.y = rotY; }
        if (Math.abs(ax[3]) > 0.12) { scaleV = Math.max(0.3, Math.min(3.0, scaleV - ax[3]*0.01)); wardrobe.scale.setScalar(scaleV); }
      }
    }
  }

  renderer.render(scene, camera);
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
